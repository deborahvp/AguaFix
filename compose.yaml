services:
  postgres:
    image: postgres:16-alpine
    container_name: aguafix_db
    environment:
      POSTGRES_DB: ${DB_NAME:-aguafix_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: deborahvp/aguafix-api:latest
    container_name: aguafix_api
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: